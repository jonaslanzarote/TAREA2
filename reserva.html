<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reserva</title>
    <style>
        body {
            background-color: lightblue;
            font-family: Arial, sans-serif;
        }
        fieldset {
            margin: 20px 0;
            padding: 10px;
            border: 1px solid blue;
        }
    </style>
</head>
<body>
    <h1>Haga su reserva</h1>
    <form action="procesareserva.php" method="GET">
        <fieldset>
            <legend>Datos Personales</legend>
            <label for="nombre">Nombre:</label>
            <input type="text" id="nombre" name="nombre" maxlength="100" required autofocus><br><br>
            <label for="apellidos">Apellidos:</label>
            <input type="text" id="apellidos" name="apellidos" maxlength="100" required><br><br>
            <label for="dni">DNI:</label>
            <input type="text" id="dni" name="dni" maxlength="10" required placeholder="DNI con letra"><br><br>
        </fieldset>
        <fieldset>
            <legend>Datos de su estancia</legend>
            <label>Habitación:</label>
            <input type="radio" id="individual" name="habitacion" value="Individual">
            <label for="individual">Individual</label>
            <input type="radio" id="doble" name="habitacion" value="Doble">
            <label for="doble">Doble</label>
            <input type="radio" id="triple" name="habitacion" value="Triple">
            <label for="triple">Triple</label><br><br>
            <label for="personas">Número de personas:</label>
            <select id="personas" name="personas">
                <option value="1">1</option>
                <option value="2">2</option>
                <option value="3">3</option>
            </select><br><br>
            <input type="checkbox" id="mascotas" name="mascotas">
            <label for="mascotas">Llevo mascotas</label><br><br>
            <label for="fecha">Fecha de llegada:</label>
            <input type="date" id="fecha" name="fecha"><br><br>
            <label for="hora">Hora de llegada:</label>
            <input type="time" id="hora" name="hora"><br><br>
        </fieldset>
        <button type="submit">Enviar</button>
        <button type="reset">Reiniciar</button>
    </form>
    <a href="index.html">Volver</a>
</body>
</html>
